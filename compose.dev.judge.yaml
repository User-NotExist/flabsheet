# Flabsheet — judge for the development stack (go-judge sandbox + judge-worker)
#
# An overlay on compose.dev.yaml, so always pass both files:
#
#   git submodule update --init judge-worker-go
#   docker compose -f compose.dev.yaml -f compose.dev.judge.yaml up --build
#
# To make that the default, put this in the root .env:
#   COMPOSE_FILE=compose.dev.yaml:compose.dev.judge.yaml
#
# Kept out of compose.dev.yaml because it builds from the submodule, which CI
# does not check out. Without it the app still runs; package builds and
# submissions just stay queued.

# go-judge only listens on loopback inside its own network namespace
x-gojudge-token: &gojudge-token dev-gojudge-token

services:
  # One-shot job: the judge worker reads its credentials from files. Compose
  # secrets can't be used for this because they are copied into the container,
  # and the worker's root filesystem is read-only.
  judge-secrets:
    image: redis:7.4.1   # any image with a shell; this one is already pulled
    restart: "no"
    environment:
      GOJUDGE_TOKEN: *gojudge-token
      API_TOKEN: ${JUDGE_API_TOKEN:-dev-judge-api-token}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET: ${RUSTFS_SECRET_KEY}
    volumes:
      - judge-secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        umask 077
        printf '%s' "$$GOJUDGE_TOKEN" > /secrets/gojudge.token
        printf '%s' "$$API_TOKEN" > /secrets/api.token
        printf '%s' "$$REDIS_PASSWORD" > /secrets/redis.password
        printf '%s' "$$S3_KEY" > /secrets/s3.key
        printf '%s' "$$S3_SECRET" > /secrets/s3.secret
        chown -R 65532:65532 /secrets

  # Sandbox that runs every compile, run and check. It must be privileged to
  # create its sandboxes, and each run gets its own isolated network.
  go-judge:
    build:
      context: ./judge-worker-go/images/go-judge
    privileged: true
    cpus: 4
    mem_limit: 6g
    memswap_limit: 6g
    shm_size: 1g
    pids_limit: 4096
    environment:
      ES_AUTH_TOKEN: *gojudge-token
    command:
      - -http-addr=127.0.0.1:5050
      - -parallelism=2   # must equal slots in infra/judge-dev/config.yaml
      - -mount-conf=/etc/go-judge/mount.yaml
      - -file-timeout=30m
      - -enable-metrics
      - -monitor-addr=0.0.0.0:5052
      - -release
    volumes:
      - judge-cache:/var/lib/judge-worker/cache:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5050"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Compiled Go, so no hot reload: after changing it, run
  #   docker compose -f compose.dev.yaml -f compose.dev.judge.yaml up -d --build judge-worker
  judge-worker:
    build:
      context: ./judge-worker-go
      dockerfile: images/judge-worker/Dockerfile
    user: "65532:65532"
    network_mode: "service:go-judge"
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - judge-cache:/var/lib/judge-worker/cache
      - judge-spool:/var/lib/judge-worker/spool
      - judge-scratch:/var/lib/judge-worker/scratch
      - judge-state:/var/lib/judge-worker/state
      - judge-secrets:/run/secrets/judge:ro
      - ./infra/judge-dev/config.yaml:/etc/judge-worker/config.yaml:ro
      - ./judge-worker-go/deploy/dev/config/languages.yaml:/etc/judge-worker/languages.yaml:ro
    tmpfs:
      - /tmp:size=256m
    depends_on:
      go-judge:
        condition: service_healthy
      judge-secrets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/judge-worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 3m
    # A job cut off here is reclaimed and rerun, so don't make Ctrl-C wait long
    stop_grace_period: 60s

volumes:
  judge-cache:
  judge-spool:
  judge-scratch:
  judge-state:
  judge-secrets:
