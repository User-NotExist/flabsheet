# Flabsheet — development stack (hot reload for backend and frontend)
#
#   cp env.example .env              # set passwords
#   docker compose -f compose.dev.yaml up --build
#
#   frontend  http://localhost:3000
#   backend   http://localhost:8000  (docs at /docs)
#
# App settings live in backend/.env and frontend/.env.
# Source is bind-mounted; rebuild (`--build`) after changing dependencies.
# Seed the first admin:
#   docker compose -f compose.dev.yaml exec backend python cli.py seed-admin
name: flabsheet-dev

include:
  - path: infra/compose.yaml   # postgres, redis, rustfs, storage-init
    env_file: .env

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Other settings come from backend/.env; these two override it because
    # inside the container the services are reached by name, not localhost.
    environment:
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-flabsheet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flabsheet}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Trust X-Forwarded-For from containers on this stack's network (the
      # frontend forwards the browser's IP), so login rate limiting and the
      # operation log see the real client instead of the frontend container.
      FORWARDED_ALLOW_IPS: ${STACK_SUBNET:-172.30.10.0/24}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Where the Next.js server reaches the backend (/api/* route handler and
    # src/proxy.ts). The browser only talks to the frontend.
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  frontend-node-modules:
  frontend-next:

# Fixed subnet so the backend can name it in FORWARDED_ALLOW_IPS. Override
# STACK_SUBNET in .env if it collides with another network on this host.
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.30.10.0/24}
