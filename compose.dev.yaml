# Flabsheet — development stack (hot reload for backend and frontend)
#
#   cp env.example .env              # set passwords
#   docker compose -f compose.dev.yaml up --build
#
#   frontend  http://localhost:3000
#   backend   http://localhost:8000  (docs at /docs)
#
# App settings live in backend/.env and frontend/.env.
# Source is bind-mounted; rebuild (`--build`) after changing dependencies.
# The judge needs the submodule: git submodule update --init judge-worker-go
# Seed the first admin:
#   docker compose -f compose.dev.yaml exec backend python cli.py seed-admin
name: flabsheet-dev

include:
  - path: infra/compose.yaml   # postgres, redis, rustfs, storage-init
    env_file: .env

# Settings the backend and its worker share. The judge runs on this stack, so
# presigned URLs are signed for the name it uses to reach RustFS, and its API
# token is set here so both sides always match.
x-backend-env: &backend-env
  POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-flabsheet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flabsheet}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_PUBLIC_ENDPOINT_URL: http://rustfs:9000
  S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
  S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
  JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:-dev-judge-api-token}

# go-judge only listens on loopback inside its own network namespace
x-gojudge-token: &gojudge-token dev-gojudge-token

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Other settings come from backend/.env; these override it because
    # inside the container the services are reached by name, not localhost.
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For from containers on this stack's network (the
      # frontend forwards the browser's IP), so login rate limiting and the
      # operation log see the real client instead of the frontend container.
      FORWARDED_ALLOW_IPS: ${STACK_SUBNET:-172.30.10.0/24}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started

  # Background jobs (package builds, judge outbox). Same image as the backend.
  # watchfiles restarts the whole process when a Python file changes; arq's
  # own --watch restarts the worker without re-importing the changed code.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["watchfiles", "--filter", "python", "arq worker.WorkerSettings", "/app"]
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      # The backend creates the schema at startup
      - backend
      - rustfs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Where the Next.js server reaches the backend (/api/* route handler and
    # src/proxy.ts). The browser only talks to the frontend.
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  # One-shot job: the judge worker reads its credentials from files. Compose
  # secrets can't be used for this because they are copied into the container,
  # and the worker's root filesystem is read-only.
  judge-secrets:
    image: redis:7.4.1   # any image with a shell; this one is already pulled
    restart: "no"
    environment:
      GOJUDGE_TOKEN: *gojudge-token
      API_TOKEN: ${JUDGE_API_TOKEN:-dev-judge-api-token}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET: ${RUSTFS_SECRET_KEY}
    volumes:
      - judge-secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        umask 077
        printf '%s' "$$GOJUDGE_TOKEN" > /secrets/gojudge.token
        printf '%s' "$$API_TOKEN" > /secrets/api.token
        printf '%s' "$$REDIS_PASSWORD" > /secrets/redis.password
        printf '%s' "$$S3_KEY" > /secrets/s3.key
        printf '%s' "$$S3_SECRET" > /secrets/s3.secret
        chown -R 65532:65532 /secrets

  # Sandbox that runs every compile, run and check. It must be privileged to
  # create its sandboxes, and each run gets its own isolated network.
  go-judge:
    build:
      context: ./judge-worker-go/images/go-judge
    privileged: true
    cpus: 4
    mem_limit: 6g
    memswap_limit: 6g
    shm_size: 1g
    pids_limit: 4096
    environment:
      ES_AUTH_TOKEN: *gojudge-token
    command:
      - -http-addr=127.0.0.1:5050
      - -parallelism=2   # must equal slots in infra/judge-dev/config.yaml
      - -mount-conf=/etc/go-judge/mount.yaml
      - -file-timeout=30m
      - -enable-metrics
      - -monitor-addr=0.0.0.0:5052
      - -release
    volumes:
      - judge-cache:/var/lib/judge-worker/cache:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5050"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Compiled Go, so no hot reload: after changing it, run
  #   docker compose -f compose.dev.yaml up -d --build judge-worker
  judge-worker:
    build:
      context: ./judge-worker-go
      dockerfile: images/judge-worker/Dockerfile
    user: "65532:65532"
    network_mode: "service:go-judge"
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - judge-cache:/var/lib/judge-worker/cache
      - judge-spool:/var/lib/judge-worker/spool
      - judge-scratch:/var/lib/judge-worker/scratch
      - judge-state:/var/lib/judge-worker/state
      - judge-secrets:/run/secrets/judge:ro
      - ./infra/judge-dev/config.yaml:/etc/judge-worker/config.yaml:ro
      - ./judge-worker-go/deploy/dev/config/languages.yaml:/etc/judge-worker/languages.yaml:ro
    tmpfs:
      - /tmp:size=256m
    depends_on:
      go-judge:
        condition: service_healthy
      judge-secrets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/judge-worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 3m
    # A job cut off here is reclaimed and rerun, so don't make Ctrl-C wait long
    stop_grace_period: 60s

volumes:
  frontend-node-modules:
  frontend-next:
  judge-cache:
  judge-spool:
  judge-scratch:
  judge-state:
  judge-secrets:

# Fixed subnet so the backend can name it in FORWARDED_ALLOW_IPS. Override
# STACK_SUBNET in .env if it collides with another network on this host.
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.30.10.0/24}
