# Flabsheet — development stack (hot reload for backend and frontend)
#
#   cp env.example .env              # set passwords
#   docker compose -f compose.dev.yaml up --build
#
#   frontend  http://localhost:3000
#   backend   http://localhost:8000  (docs at /docs)
#
# App settings live in backend/.env and frontend/.env.
# Source is bind-mounted; rebuild (`--build`) after changing dependencies.
# The judge is optional and lives in compose.dev.judge.yaml (see its header).
# Seed the first admin:
#   docker compose -f compose.dev.yaml exec backend python cli.py seed-admin
name: flabsheet-dev

include:
  - path: infra/compose.yaml   # postgres, redis, rustfs, storage-init
    env_file: .env

# Settings the backend and its worker share. The judge (compose.dev.judge.yaml)
# runs on this stack, so presigned URLs are signed for the name it uses to
# reach RustFS, and both sides read the same JUDGE_API_TOKEN default.
x-backend-env: &backend-env
  POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-flabsheet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flabsheet}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_PUBLIC_ENDPOINT_URL: http://rustfs:9000
  S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
  S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
  JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:-dev-judge-api-token}
  # The server's time zone: the top bar's clock shows this zone's wall time.
  # Timestamps are stored and sent with their offset, so nothing else moves.
  TZ: Asia/Bangkok

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Other settings come from backend/.env; these override it because
    # inside the container the services are reached by name, not localhost.
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For from containers on this stack's network (the
      # frontend forwards the browser's IP), so login rate limiting and the
      # operation log see the real client instead of the frontend container.
      FORWARDED_ALLOW_IPS: ${STACK_SUBNET:-172.30.10.0/24}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started

  # Background jobs (package builds, judge outbox). Same image as the backend.
  # watchfiles restarts the whole process when a Python file changes; arq's
  # own --watch restarts the worker without re-importing the changed code.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["watchfiles", "--filter", "python", "arq worker.WorkerSettings", "/app"]
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      # The backend creates the schema at startup
      - backend
      - rustfs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Where the Next.js server reaches the backend (/api/* route handler and
    # src/proxy.ts). The browser only talks to the frontend.
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  frontend-node-modules:
  frontend-next:

# Fixed subnet so the backend can name it in FORWARDED_ALLOW_IPS. Override
# STACK_SUBNET in .env if it collides with another network on this host.
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.30.10.0/24}
