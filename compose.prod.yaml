# Flabsheet — production stack
#
#   cp env.example .env              # set real secrets
#   # app settings: backend/.env and frontend/.env (copied into the images)
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml exec backend python cli.py seed-admin
#
# Backend and frontend bind to APP_BIND_ADDR (127.0.0.1 by default) and are
# meant to sit behind a TLS reverse proxy. The .env files are baked in at build
# time: rebuild (`--build`) after changing them. Never push these images.
name: flabsheet

include:
  - path: infra/compose.yaml   # postgres, redis, rustfs, storage-init
    env_file: .env

# Settings the backend and its worker share. S3_PUBLIC_ENDPOINT_URL (the
# address judge hosts use for RustFS) and JUDGE_API_TOKEN stay in backend/.env.
x-backend-env: &backend-env
  POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-flabsheet}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-flabsheet}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: flabsheet-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Other settings come from backend/.env; these override it because
    # inside the container the services are reached by name, not localhost.
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For from containers on this stack's network (the
      # frontend forwards the browser's IP), so login rate limiting and the
      # operation log see the real client instead of the frontend container.
      FORWARDED_ALLOW_IPS: ${STACK_SUBNET:-172.30.20.0/24}
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks: [default, judge]

  # Background jobs (package builds, judge outbox). Same image as the backend.
  worker:
    # Same build as the backend, so `up --build` never looks for the tag in a registry
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: flabsheet-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["arq", "worker.WorkerSettings"]
    environment:
      <<: *backend-env
    # The image's HEALTHCHECK probes the API port, which the worker never opens
    healthcheck:
      disable: true
    depends_on:
      # The backend creates the schema at startup
      backend:
        condition: service_healthy
      rustfs:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: flabsheet-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    # Where the Next.js server reaches the backend (/api/* route handler and
    # src/proxy.ts). The browser only talks to the frontend.
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

# Fixed subnet so the backend can name it in FORWARDED_ALLOW_IPS. Override
# STACK_SUBNET in .env if it collides with another network on this host.
networks:
  default:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-172.30.20.0/24}
  judge:
    external: true
    name: judge-net
